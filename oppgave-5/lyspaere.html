<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .lightbulbAv{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            background-color: grey;
            border: 5px solid black;
            
        }
        
        .lightbulbPaa{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            background-color: yellow;
            border: 5px solid black;
            
        }

        .lightbox{
            height: 100px;
            width: 75px;
            background-color: grey;
            margin-left: 37px;
            border: 5px solid black;
        }

        .lysBryter{
            height: 50px;
            width: 25px;
            background-color: green;
            margin: 50px;
            border: 5px solid black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id=lysPaere class="lightbulbAv"></div>
    <div class="lightbox"></div>

    <br>
    Er lyset på eller av? <br>
    <br>

    <div id="lysTekst"></div>

    <div class="lysBryter" onclick="bryterKnapp()"></div>

    <script>
        const lysVar = document.getElementById('lysPaere');

        let lys = 0;

        function bryterKnapp(){
            if(lys===0){
                lysVar.classList.add("lightbulbPaa");
                document.getElementById('lysTekst').innerHTML = "Hvorfor er lyset på?"
            }

            else{
                lysVar.classList.remove("lightbulbPaa");
                document.getElementById('lysTekst').innerHTML = "Hvem slo av lyset?!"
            }
            lys++;

            if(lys > 1){
                lys = 0;
            }
        }
    </script>

</body>
</html>
