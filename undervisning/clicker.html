<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker-eksempel</title>
  </head>
  
  <body>
    <h2 id="points">0</h2>
    <button onclick="addPoints()">click</button>
    <div>
      <h3>Upgrades!</h3>
      
      <span>Price: <span id="upgrade_1_price">10</span></span>
      
      <button disabled id="upgrade_1" onclick="addUpgrade(5, 'upgrade_1')">
        +5
      </button>
      
      <span>Price: <span id="upgrade_2_price">20</span></span>
      
      <button disabled id="upgrade_2" onclick="addUpgrade(10, 'upgrade_2')">
        +10
      </button>

    </div>
    <div>Total clicks: <span id="clicks">0</span></div>
    <div>Upgrades bought: <span id="upgradesBought">0</span></div>


    <script>
        // var number = 1;
        // let text = "Hei på deg";
        // const letterA = "A";

        // let isOpen = false;
        // let isLoggedIn;

        // console.log(isLoggedIn);
        // isLoggedIn = true;
        // isLoggedIn = !isLoggedIn;
        // console.log(isLoggedIn);

        let points = 0;
        let clicks = 0;
        let amountToAdd = 1;
        let upgradesBought = 0;
        let upgradePrice1 = 10;
        let upgradePrice2 = 20;

        function addPoints() {
        points += amountToAdd;
        clicks++;
        updateDisplay();
        }

        function updateDisplay() {
        document.getElementById("points").innerHTML = points;
        document.getElementById("clicks").innerHTML = clicks;
        document.getElementById("upgradesBought").innerHTML = upgradesBought;
        document.getElementById("upgrade_1_price").innerHTML = upgradePrice1;
        document.getElementById("upgrade_2_price").innerHTML = upgradePrice2;
        checkUpgradeButtons();
        }

        function addUpgrade(amount, buttonId) {
        upgradesBought++;
        amountToAdd += amount;
        points -= buttonId == "upgrade_1" ? upgradePrice1 : upgradePrice2;
        upgradePrice1 = buttonId == "upgrade_1" ? upgradePrice1 * 2 : upgradePrice1;
        upgradePrice2 = buttonId == "upgrade_2" ? upgradePrice2 * 2 : upgradePrice2;
        updateDisplay();
        }

        function checkUpgradeButtons() {
        document.getElementById("upgrade_1").disabled =
            points > upgradePrice1 ? false : true;
        document.getElementById("upgrade_2").disabled =
            points > upgradePrice2 ? false : true;
        }



    </script>


  </body>
</html>
