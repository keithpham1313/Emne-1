<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lars Monsen Inventory</title>
    <link rel="stylesheet" href="style-grid-backpack.css"/>
    <link rel="stylesheet" href="style-grid-available-items.css"/>

    <style>
        .grid-sekk{
    margin-top: 2%;
    margin-left: 10%;
    display: grid;
    grid-template-columns: 100px 100px 100px;
    grid-template-rows: 100px 100px 100px;
    gap: 8px;
    }

    .grid-inv{
        display: grid;
        grid-template-columns: repeat(8, 100px);
        grid-template-rows: 100px 100px 100px;
        gap: 8px;
    }

    .item{
        border: solid black;
        text-align: center;
    }

    .toggleInventory{
        
    }
    </style>
</head>

<body>
    <h1 style="">Ta med på tur!</h1>
    <button onclick="tømSekk()">Destroy items in bag</button>
    <button onclick="hideShowInv()">Hide/Show Inventory</button>


    <div id="myInventory" class="grid-sekk">
        <div id="rute0" class="item"></div>
        <div id="rute1" class="item"></div>
        <div id="rute2" class="item"></div>
        <div id="rute3" class="item"></div>
        <div id="rute4" class="item"></div>
        <div id="rute5" class="item"></div>
        <div id="rute6" class="item"></div>
        <div id="rute7" class="item"></div>
        <div id="rute8" class="item"></div>

    </div>

    <h2> Meny </h2>

    <div class="grid-inv">
        <div class="item" id="kvikklunsj" onclick="leggTilItem('Kvikklunsj', this)"><span class="tooltiptext">Kvikklunsj</span></div>
        <div class="item" id="vannflaske" onclick="leggTilItem('Vannflaske', this)">Vannflaske</div>
        <div class="item" id="monsenbilde" onclick="leggTilItem('Bilde av Lars Monsen', this)">Bilde av Lars Monsen</div>        
        <div class="item" id="kartkompass" onclick="leggTilItem('Kart og kompass', this)">Kart og kompass</div>
        <div class="item" id="myggspray" onclick="leggTilItem('Myggspray', this)">Myggspray</div>
        <div class="item" id="sovepose" onclick="leggTilItem('Sovepose', this)">Sovepose</div>
        <div class="item" id="telt" onclick="leggTilItem('Telt', this)">Telt</div>
        <div class="item" id="solkrem" onclick="leggTilItem('Solkrem', this)">Solkrem</div>
        <div class="item" id="førstehjelp" onclick="leggTilItem('Førstehjelp', this)">Førstehjelp</div>
        <div class="item" id="lommelykt" onclick="leggTilItem('Lommelykt', this)">Lommelykt</div>
        <div class="item" id="batteri" onclick="leggTilItem('Batteri', this)">Batteri</div>
        <div class="item" id="lighter" onclick="leggTilItem('Lighter', this)">Lighter</div>
        <div class="item" id="ved" onclick="leggTilItem('Ved', this)">Ved</div>
        <div class="item" id="kniv" onclick="leggTilItem('Kniv', this)">Kniv</div>
        <div class="item" id="grillspyd" onclick="leggTilItem('Grillspyd', this)">Grillspyd</div>
        <div class="item" id="sko" onclick="leggTilItem('Ekstra sko', this)">Ekstra sko</div>

    </div>

<script>
    let plass = 0;

function leggTilItem(item, tomt){
    if (tomt.innerHTML !== ""){
        switch (plass){
            case 0:
                document.getElementById('rute0').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 1:
                document.getElementById('rute1').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 2:
                document.getElementById('rute2').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 3:
                document.getElementById('rute3').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 4:
                document.getElementById('rute4').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 5:
                document.getElementById('rute5').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 6:
                document.getElementById('rute6').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 7:
                document.getElementById('rute7').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
            case 8:
                document.getElementById('rute8').innerHTML = item;
                tomt.innerHTML = "";
                plass++;
                break;
        }
    }
    
}

function tømSekk(){
    let sekkItems = document.querySelectorAll('#myInventory *');
        for (let item of sekkItems){
            item.innerHTML = "";
        }
    plass = 0;
}

function hideShowInv(){
    document.getElementById('myInventory').classList.toggle('toggleInventory');
}
</script>

        plass++;
    }


</script> -->

</body>
</html>
