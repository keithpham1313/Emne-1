<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            height: 100px;
            width: 100px;
            margin-bottom: 50px;
            border: 10px;
            border-color: black;
            cursor:pointer;
        }
        .red{
            background-color: red;

        }
        .blue{
            background-color: blue;

        }
        .yellow{
            background-color: yellow;

        }

        
    </style>
</head>
<body id="farge">
    <div class="red box" onclick="changeColorRed()"></div>
    <div class="blue box" onclick="changeColorBlue()"></div>
    <div class="yellow box" onclick="changeColorYellow()"></div>

    <!-- <button onclick="addContent()">Add</button>

        function changeColorBlue(){
