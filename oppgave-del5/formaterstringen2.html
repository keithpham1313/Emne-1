<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="formatString()">Check</button>
    <input type="text" onchange="inputText(this.value)">
    <div id="textID">Ingenting</div>

    <script>
        let navn = "terje";
        // console.log(navn[0]);

        let bokstaver = "abcdefghijklmnopqrstuvwxyzæøå";


        function formatString(){
            if(bokstaver.includes(navn[0])){                    //hvis vi legger til denne, så vises ikke resultatet når man f.eks. skriver 123terje
            navn = navn[0].toUpperCase() + navn.slice(1)

            document.getElementById("textID").innerHTML = navn;
            }

            
        }

        function inputText(nameInput){
            navn = nameInput;
            formatString();

        }

    </script>

    
</body>
</html>
