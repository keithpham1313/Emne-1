<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .group{
            display: flex;
            flex-direction: row;
            gap: 5px;
        }


    </style>
</head>

<body>
    <div id="app"></div>


    <script>

        let colorVar = "_____";
        let itVar = "_____";
        let actionVar = "_____";
        let objVar = "_____";

        updateView()

        function updateView(){
            let html = `
            <div class="group">
             <div>Once, there was an</div>
             <div>${colorVar} ${itVar}</div>
             </div>

            <div class="group">
             <div>that</div>
             <div>${actionVar}</div>
             </div>

            <div class="group">
             <div>in the</div>
             <div>${objVar}</div>
             </div>
            
             <div class="group">
             <div> - and great things happened. The End. </div>
             </div>

                <button class="knapp" onclick="changeWord('Orange',1)">Orange</button>
                <button class="knapp" onclick="changeWord('Black',1)">Black</button>

                <button class="knapp" onclick="changeWord('Cat',2)">Cat</button>
                <button class="knapp" onclick="changeWord('Man',2)">Man</button>

                <button class="knapp" onclick="changeWord('Stared',3)">Stared</button>
                <button class="knapp" onclick="changeWord('Jumped',3)">Jumped</button>

                <button class="knapp" onclick="changeWord('Pool',4)">Pool</button>
                <button class="knapp" onclick="changeWord('Wall',4)">Wall</button>


            `;

            document.getElementById('app').innerHTML = html;

        }

        function changeWord(word, place){

            if(place==1){
                colorVar = word;
            }
            
            if(place==2){
                itVar = word;
            }

            if(place==3){
                actionVar = word;
            }

            if(place==4){
                objVar = word;
            }

            updateView()
        }

    </script>
</body>
</html>
