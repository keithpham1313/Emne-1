<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 3</h2>

    <input onchange="passordInput = (this.value)">
    <button onclick="sjekkPassord()">Sjekk</button>
    <p id="visMelding"></p>


    <script>
        function sjekkPassord(){
            let melding = returPassord(passordInput);
            document.getElementById('visMelding').innerHTML = melding;
        }

        function returPassord(passord){
            if(passord === "hemmelighet123"){
                return "Riktig passord, velkommen inn!"
            }
            else{
                return "Feil passord, prøv igjen."
            }
        }

    </script>

</body>
</html>
