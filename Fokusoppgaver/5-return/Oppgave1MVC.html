<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 1</h2>

    <div id="app"></div>

    <script>

        //MODEL

        let appView = document.getElementById('app');

        let tempInput;
        let melding = "Skriv inn en temperatur for å sjekke.";

        //VIEW

        function updateView(){
            let html = /*HTML*/`
                <input onchange="tempInput = Number(this.value)">
                <button onclick="tempController()">Sjekk</button>
                <p>${melding}</p>
            `;

            appView.innerHTML = html;
        }

        updateView();

        // CONTROLLER

        function tempController(){
            melding = sjekkTemp(tempInput)
            
            updateView();

        }

        function sjekkTemp(temp){

            if(temp > 20){
                return "Det er varmt ute!";
            }
            else if(temp >= 5 && temp <= 20){
                return "Det er passe temperatur."
            }
            else if(temp < 5){
                return "Det er kaldt ute!"
            }
        }


    </script>

</body>
</html>
