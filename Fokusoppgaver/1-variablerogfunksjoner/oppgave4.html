<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body class="darkmode">
<body>
    
    <h2>OPPGAVE 4</h2>

    <input onchange="tallEn(this.value)" type="number">
    <input onchange="tallTo(this.value)" type="number">
    <button onclick="gangeTall()">Gange to tall</button>
    <p id="visResultat"></p>

    <script>
        let tallEnVar;
        let tallToVar;
        let resultatVar;

        function tallEn(tallEnPara){
            tallEnVar = Number(tallEnPara);
        }

        function tallTo(tallToPara){
            tallToVar = Number(tallToPara);
        }

        function gangeTall(){

            resultatVar = tallEnVar * tallToVar;

            document.getElementById('visResultat').innerHTML = resultatVar;
        }
    </script>
    
</body>
</html>
