<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 5</h2>

    <input onchange="fargeFelt(this.value)" type="text">
    <button onclick="knappFarge()">Bytt Farge</button>
    
    <script>
        let lagreFargeVar = "";

        function fargeFelt(inputFarge){
            lagreFargeVar = inputFarge;

        }

        function knappFarge(){

            document.getElementById('bakgrunn').style.backgroundColor = lagreFargeVar;
        }
    </script>
</body>
</html>
