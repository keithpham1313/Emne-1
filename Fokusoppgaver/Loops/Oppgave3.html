<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 3</h2>

    <div id="app"></div>

    <script>
        let appView = document.getElementById('app');

        let tilfeldigTall = Math.floor(Math.random()*10) +1;
        let inputSvar = 0;
        let antallForsøk = 0;

        updateView()

        function updateView(){
            let htmlVar = '';
            
            htmlVar += /*HTML*/ `
                <p>Trykk på knappen for å starte spillet. Gjett et tall mellom 1 og 10!</p>
                <input onchange="inputSvar = Number(this.value)" type="number">
                <button onclick="gjettSvar()">Gjett</button>

                <div id="visMelding"></div>


            `;

            appView.innerHTML = htmlVar;
        }

        function gjettSvar(){
            let visMeldingVar = document.getElementById('visMelding');
            

            //while-loop kjører helt til riktig tall er gjettet
            while(Number(inputSvar) !== tilfeldigTall){
                
                antallForsøk++;

            if(Number(inputSvar) < tilfeldigTall){
                visMeldingVar.innerHTML = "For lavt! Prøv igjen!";
            }
            else if(Number(inputSvar) > tilfeldigTall){
                visMeldingVar.innerHTML = "For høyt! Prøv igjen!";
                }
                break;
            }

            if(Number(inputSvar) === tilfeldigTall){
                
                antallForsøk++

                visMeldingVar.innerHTML = `
                Riktig svar! Det hemmelige tallet var ${tilfeldigTall}. 
                <br> 
                Du brukte ${antallForsøk} forsøk!`

                //Nullstiller spillet
                tilfeldigTall = rngFunk();
                antallForsøk = 0;

                console.log(tilfeldigTall);
            }
        }



            
        //Lager et tilfeldig tall mellom 1 og 10
        function rngFunk(){
            return Math.floor(Math.random()*10) +1;
        }

        console.log(rngFunk());

    </script>




</body>
</html>
