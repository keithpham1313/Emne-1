<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 3</h2>

    <div id="app"></div>

<script>
    let iRobot = [
        {
            navn: "Roberto En",
            batterinivå: 100,
            gjenstander: ["Papp", "Papir"],
            antallRydd: 0,
        },
        {
            navn: "Roberto To",
            batterinivå: 75,
            gjenstander: "Plastikk",
            antallRydd: 0,            
        },
        {
            navn: "Roberto Tre",
            batterinivå: 50,
            gjenstander: ["Tallerkener", "bestikk"],
            antallRydd: 0,            
        },
        {
            navn: "Roberto Fire",
            batterinivå: 25,
            gjenstander: "Tomme flasker",
            antallRydd: 0,            
        },
    ];
    
    let appView = document.getElementById('app');

    let antallRydd = 0;

    let ladeIntervaller = [];

    function updateView(){
        
        let html = /*HTML*/ `
            <h3>Oversikt på mine roboter</h3>
            
        `;

        for(let i = 0; i < iRobot.length; i++){
            html += /*HTML*/ `
                <h4>${iRobot[i].navn}</h4>
                <p>Batterinivå: ${iRobot[i].batterinivå} %</p>
                <p>Gjenstander: ${iRobot[i].gjenstander}</p>
                <p>Antall Rydd: ${iRobot[i].antallRydd}</p>

                <button onclick="ryddFunk(${i})">Rydde</button>
                <button onclick="ladeFunk(${i})">Lade</button>
                <br>
                
            `;
        };

        appView.innerHTML = html;

    }
    
    updateView();
    
    /* FORKLARING PÅ ${i}

    <button onclick="ryddFunk(${i})">Rydde</button>
    1) <button onclick="ryddFunk(0)">Rydde</button>
    2) <button onclick="ryddFunk(1)">Rydde</button>...

    Her skriver vi ${i} for at funksjonen ryddFunk() skal vite hvilken 
    robot vi trykket på. 

    Hvis vi trykket på robot 3, så blir ryddFunk(2).
    Altså parameteren batteribruk blir satt til 2:
        batteriBruk = 2
    
    Og dermed blir:
        iRobot[batteriBruk].batterinivå -= 10;
    
    Til detter:
        iRobot[2].batterinivå -= 10;

    Og 10% blir trukket fra batterinivået til robot nummer 3. 
    */


    function ryddFunk(batteriBruk){
        if(iRobot[batteriBruk].batterinivå >= 0){

        iRobot[batteriBruk].batterinivå -= 10;
        }

        else{
            alert("Din robot har gått tom for batteri og må lades!")
        }

        iRobot[batteriBruk].antallRydd++;

        updateView();
       
        // console.log(batteriBruk);
    }

    function ladeFunk(batteriLade){
        if(iRobot[batteriLade].batterinivå < 100){

        ladeIntervaller[batteriLade] = setInterval(
            function (){
                intervalFunk(batteriLade)
            }, 100);        
        };        
    }

    /* Hvorfor har vi en funksjonen inni en funksjon?
    Hvis vi hadde dette, så hadde funksjonen kjørt med en gang:
        
        setInterval(intervalFunk(batteriLade), 100);

    Denne funksjonen blir ikke kjørt med en gang:
    
        function (){
            intervalFunk(batteriLade)
        }
    
    Funksjonen inni setInterval() er der fordi setInterval trenger å vite 
    hva den skal gjøre hver gang intervallet går ut (altså etter hvert 100 millisekund)
    
    
    */

    function intervalFunk(batteriLade){
        iRobot[batteriLade].batterinivå++;

        if(iRobot[batteriLade].batterinivå >= 100){
            
                if(iRobot[batteriLade].batterinivå == 100){
                    alert(`Din robot ${iRobot[batteriLade].navn} er ferdig ladet!`);
                }

            clearInterval(ladeIntervaller[batteriLade]);

            ladeIntervaller[batteriLade] = null;
        }
        updateView();
    }


</script>



</body>
</html>
