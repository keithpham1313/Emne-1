<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 5</h2>

    <div id="app"></div>

<script>

    let godteri = [
        {
            navn: "Sjokoladebit",
            type: "Sjokolade",
            verdi: 5,
            antall: 3,
        },
        {
            navn: "Karamell",
            type: "Karamell",
            verdi: 3,
            antall: 5,            
        },
        {
            navn: "Surt godteri",
            type: "Surt",
            verdi: 2,
            antall: 3,            
        },
        {
            navn: "Stor sjokolade",
            type: "Sjokolade",
            verdi: 10,
            antall: 4,            
        },
        {
            navn: "Karamellstang",
            type: "Karamell",
            verdi: 4,
            antall: 6,            
        },
        {
            navn: "Surt gelegodteri",
            type: "Surt",
            verdi: 3,
            antall: 7,            
        },
    ];

    let mineGodteri = [
        {
            navn: "Sjokoladebit",
            type: "Sjokolade",
            verdi: 5,
            antall: 6,
        },
        {
            navn: "Karamell",
            type: "Karamell",
            verdi: 3,
            antall: 3,            
        },
        {
            navn: "Surt godteri",
            type: "Surt",
            verdi: 2,
            antall: 6,            
        },
        {
            navn: "Stor sjokolade",
            type: "Sjokolade",
            verdi: 10,
            antall: 9,            
        },
        {
            navn: "Karamellstang",
            type: "Karamell",
            verdi: 4,
            antall: 4,            
        },
        {
            navn: "Surt gelegodteri",
            type: "Surt",
            verdi: 3,
            antall: 9,            
        },
    ];

    let appView = document.getElementById('app');
    let antallBytte;
    let mittAntallBytte;

    function updateView(){
        let html = /*HTML*/`
        <h2>Godteribyttemarked</h2>
        `;

        for(let i = 0; i < godteri.length; i++){
            html += /*HTML*/ `
                
                <h4>${godteri[i].navn}</h4>
                <p>Type: ${godteri[i].type}</p>
                <p>Verdi: ${godteri[i].verdi}</p>
                <p>Antall: ${godteri[i].antall}</p>

                <input onchange="antallBytte = Number(this.value)" placeholder="Angi ønsket antall" type="Number">
                <button onclick="bytteFunk(${i})">Bytte</button>
                <br><br>
            `;
        };

        html = /*HTML*/`
        <h2>Mine Godteri</h2>
        `;

        for(let p = 0; p < godteri.length; p++){
            html += /*HTML*/ `
                
                <h4>${mineGodteri[p].navn}</h4>
                <p>Type: ${mineGodteri[p].type}</p>
                <p>Verdi: ${mineGodteri[p].verdi}</p>
                <p>Antall: ${mineGodteri[p].antall}</p>

                <input onchange="mittAntallBytte = Number(this.value)" placeholder="Angi ønsket antall" type="Number">
                <button onclick="minBytteFunk(${p})">Bytte</button>
                <br><br>
            `;
        };

        appView.innerHTML = html;        
    }

    updateView();

    function bytteFunk(gittAntall){
        godteri[gittAntall].antall;


    }

</script>



</body>
</html>
