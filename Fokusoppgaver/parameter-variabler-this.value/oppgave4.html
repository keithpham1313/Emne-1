<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 4</h2>

    <div id="kloneKnappID">
        <button class="knapp" onclick="kloneKnapp()">Klone meg selv</button>
    </div>
    
    <p id="visKnapp"></p>

    <script>
        let lagreKlone;

        function kloneKnapp(){
            lagreKlone = document.getElementById('kloneKnappID').innerHTML;
            document.getElementById('visKnapp').innerHTML += lagreKlone;
        }


    </script>

    

    


</body>
</html>
