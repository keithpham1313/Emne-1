<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 2</h2>

    <input onchange="tallEn(this.value)" type="number">
    <input onchange="tallTo(this.value)" type="number">
    <button onclick="beregnTall()">Beregn Tall</button>
    <p id="svarHer"></p>

    <script>
        let tallEnVar;
        let tallToVar;
        let resultatVar;

        function tallEn(paraEn){
            tallEnVar = Number(paraEn);

        }
        
        function tallTo(paraTo){
            tallToVar = Number(paraTo);

        }

        function beregnTall(){
            resultatVar = tallEnVar * tallToVar;

            document.getElementById('svarHer').innerHTML = `${tallEnVar} x ${tallToVar} = ${resultatVar}`;
        }
    </script>

    


</body>
</html>
