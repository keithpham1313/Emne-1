<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 1</h2>

    <input onchange="inputNavn(this.value)" placeholder="navn">
    <input onchange="inputAlder(this.value)" placeholder="alder">
    <input onchange="inputFarge(this.value)" placeholder="favorittfarge">
    <button onclick="registrereKnapp()">Registrer</button>
    <p id="visResultat"></p>

    <script>
        let navnVar;
        let alderVar;
        let fargeVar;
        
        function inputNavn(paraNavn){
            navnVar = paraNavn;
        }

        function inputAlder(paraAlder){
            alderVar = paraAlder;
        }

        function inputFarge(paraFarge){
            fargeVar = paraFarge;
        }

        function registrereKnapp(){

            document.getElementById('visResultat').innerHTML += `<li>${navnVar}, ${alderVar}, ${fargeVar}</li>`;

            document.getElementById('bakgrunn').style.backgroundColor = fargeVar;            
        }
    </script>


</body>
</html>
