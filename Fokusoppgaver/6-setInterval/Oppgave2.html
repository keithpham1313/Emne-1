<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 2</h2>

    <input oninput="definerTemp = Number(this.value)">

    Høyreste Temp: <div id="høyesteTemp"></div>
    <br>
    Laveste Temp: <div id="lavesteTemp"></div>
    
    <p id="visMelding"></p>
    <p id="visTemp"></p>

    <script>
        let gjeldendeTemp = 0;
        let definerTemp = 30;

        let høyesteTemp = -Infinity;
        let lavesteTemp = Infinity;

        rngTemp();

        setInterval(rngTemp, 2000);

        function rngTemp(){
            gjeldendeTemp = Math.floor(Math.random()* (definerTemp * 2 + 1)) - definerTemp;

            document.getElementById('visTemp').innerHTML += `<li>${gjeldendeTemp} grader</li>`;
            

            if(gjeldendeTemp > 20){
                document.getElementById('visMelding').innerHTML = "Det er for varmt!";
                document.getElementById('visMelding').style.backgroundColor = "red";
            }
            else if(gjeldendeTemp >= 5 && gjeldendeTemp <= 20){
                document.getElementById('visMelding').innerHTML = "Det er normal temperatur.";
                document.getElementById('visMelding').style.backgroundColor = "green";
            }
            else if(gjeldendeTemp < 5){
                document.getElementById('visMelding').innerHTML = "Det er for kaldt!";
                document.getElementById('visMelding').style.backgroundColor = "blue";
            }

            høyesteTemp = Math.max(høyesteTemp, gjeldendeTemp);
            document.getElementById('høyesteTemp').innerHTML = `${høyesteTemp} grader`;
            
            lavesteTemp = Math.min(lavesteTemp, gjeldendeTemp);
            document.getElementById('lavesteTemp').innerHTML = `${lavesteTemp} grader`;
            


            console.log(gjeldendeTemp);

        }

    </script>



</body>
</html>
