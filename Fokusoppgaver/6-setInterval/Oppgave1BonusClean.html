<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        .nedtelling{
            background-color: red;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 1 BONUS</h2>

    <input onchange="sekunderInput = Number(this.value)" type="number">
    <button onclick="startClick()">Start Nedtellingen</button>
    <button onclick="pauseClick()">Pause Nedtellingen</button>

    <p id="visTid"></p>
    <p id="visMelding"></p>

    <script>
        let sekunderInput;
        let sekunderStopp = null;

        let alarmLyd = new Audio("Dune Scream.mp3");

        function pauseClick(){
            clearInterval(sekunderStopp);
            sekunderStopp = null;

        }

        function startClick(){
            if(!sekunderStopp){
                sekunderStopp = setInterval(nedtelling, 1000)};
        }

        function nedtelling(){
            returMelding(sekunderInput);
            sekunderInput --;

            document.getElementById('visTid').innerHTML = sekunderInput;

            if(sekunderInput <= 10){
                document.getElementById('visTid').style.color = 'red';
            }

            if(sekunderInput === 0){
                pauseClick();
                document.getElementById('visTid').innerHTML = 0;
                alarmLyd.play();
            }
        }

        function returMelding(returTid){
            if(returTid === 10){
                // alert("Det er 10 sekunder igjen!");
                document.getElementById('visMelding').innerHTML = "Det er 10 sekunder igjen!";
            }
            else if(returTid === 1){
                // alert("Nedtellingen er ferdig!");
                document.getElementById('visMelding').innerHTML = "Nedtellingen er ferdig!";
            }
        }

    </script>



</body>
</html>
