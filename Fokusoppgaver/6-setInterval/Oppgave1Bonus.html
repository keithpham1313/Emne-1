<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        .nedtelling{
            background-color: red;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 1 BONUS</h2>

    <input onchange="sekunderInput = Number(this.value)" type="number">
    <button onclick="startClick()">Start Nedtellingen</button>
    <button onclick="pauseClick()">Pause Nedtellingen</button>

    <p id="visTid"></p>
    <p id="visMelding"></p>

    <script>
        let sekunderInput;
        let sekunderStopp = null;

        function pauseClick(){
            clearInterval(sekunderStopp);
            sekunderStopp = null;

        }

        function startClick(){
            if(!sekunderStopp){
                sekunderStopp = setInterval(nedtelling, 1000)};
        }

        function nedtelling(){
            returMelding(sekunderInput);
            sekunderInput --;

            document.getElementById('visTid').innerHTML = sekunderInput;

            if(sekunderInput <= 10){
                document.getElementById('visTid').style.color = 'red';
            }
        }

        function returMelding(returTid){
            if(returTid === 10){
                alert("Det er 10 sekunder igjen!");
                // document.getElementById('visTid').style.color = 'red';
                // alert dukker opp konstant når man legger denne her.
            }
            // else if(returTid <= 10){
            //     // document.getElementById('visTid').classList.add('nedtelling');
            //     document.getElementById('visTid').style.color = 'red';

            // }
            
            else if(returTid === 0){
                alert("Nedtellingen er ferdig!");
            }


        }
    </script>



</body>
</html>
