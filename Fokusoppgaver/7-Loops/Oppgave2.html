<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }

        .melk{
            color: blue;
        }

        .brød{
            color: yellow;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 2</h2>

    <div id="app"></div>

    <script>
        let handleListeVar = ["melk", "brød", "ost", "egg"];

        handleListeFunk()

        function handleListeFunk(){

            let arrayListe = '';

            for(let i = 0; i < handleListeVar.length; i++){

                if(i === 0){
                    arrayListe += `<li class="melk">${handleListeVar[i]}</li>`;      
                }
                else if(i === 1){
                    arrayListe += `<li class="brød">${handleListeVar[i]}</li>`;      
                }
                else{
                    arrayListe += `<li>${handleListeVar[i]}</li>`;
                }

                
            }
            document.getElementById('app').innerHTML = arrayListe;
            
            console.log(arrayListe);
        }
    </script>




</body>
</html>
