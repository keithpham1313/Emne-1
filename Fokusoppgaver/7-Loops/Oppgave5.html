<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 5</h2>

    <div id="app"></div>

    <script>
        let viewApp = document.getElementById('app');
        
        let mittArray = ["5", "12", "8", "20", "3"];
        let mittResultat = 0;
        let visMelding = "";

        loopMeg();

        function loopMeg(){
            let html = '';

            for(let i = 0; i < mittArray.length; i++){
                
                mittResultat += Number(mittArray[i]);
            };
                if(mittResultat <= 30){
                    visMelding = "Summen er 30 eller mindre";
                }
                else if(mittResultat > 30){
                    visMelding = "Summen er over 30";
                };

                html += /*HTML*/ `
                    <div>Summen er ${mittResultat}</div>
                    <br>
                    <div> ${visMelding}</div>
                `;
            
                
            viewApp.innerHTML = html;
        }

    </script>




</body>
</html>
