<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 1</h2>
    
    <b>Tekst 1: </b><input onchange="lagreInputVar1 = (this.value)">
    <b>Farge 1:</b><input onchange="fargeInput1 = (this.value)">
    <br>
    <b>Tekst 2: </b><input onchange="lagreInputVar2 = (this.value)">
    <b>Farge 2:</b><input onchange="fargeInput2 = (this.value)">

    <div id="knappID">
    <button class="knapp" onclick="thisKnapp(this)">THIS?</button>
    </div>
    <p id="visKlonetKnapp"></p>

    <script>
        let knappTilstand = 0;
        let kloneKnappVar;
        
        let lagreInputVar1 = "NEIN THIS?";
        let lagreInputVar2 = "THIS?";

        let fargeInput1;
        let fargeInput2;


        function thisKnapp(meinKnapp){

            if(knappTilstand === 0){
                meinKnapp.innerHTML = `${lagreInputVar1}`;
                meinKnapp.style.backgroundColor = `${fargeInput1}`; 

                knappTilstand = 1;

                kloneFunk();
                }
            else if(knappTilstand === 1){
                meinKnapp.innerHTML = `${lagreInputVar2}`;
                meinKnapp.style.backgroundColor = `${fargeInput2}`;
                
                knappTilstand = 0;

                kloneFunk();
                }          
        }

        function kloneFunk(){
                kloneKnappVar = document.getElementById('knappID').innerHTML;
                document.getElementById('visKlonetKnapp').innerHTML += kloneKnappVar;

        }

    </script>


</body>
</html>
