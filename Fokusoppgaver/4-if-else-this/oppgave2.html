<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 2</h2>
    
    <p><b>Navn:</b> Peer Gynt</p>
    <p><b>Saldo:</b> <span id="saldoID">0</span> kr</p>

    <input onchange ="innskuddVar = Number(this.value)" type="number">
    <button onclick="innskuddKnapp()"><b>Innskudd</b></button>
    <br><br>

    <b>Uttak:</b><input onchange ="uttakVar = Number(this.value)" type="number">
    <button onclick="uttakKnapp()">Bekreft</button>

    <script>
        let innskuddVar;
        let uttakVar = 0;

        let nySaldoVar = 0;

        function innskuddKnapp(){

            nySaldoVar += innskuddVar;

            if(innskuddVar <= 0){
                alert("Vennligst skriv inn et gyldig beløp over 0 kr.");
            }            
            
            document.getElementById('saldoID').innerHTML = nySaldoVar;


        }

        function uttakKnapp(){
           
            if(nySaldoVar <= 0){
                alert("Ugyldig beløp.")
            }
            else{
                nySaldoVar -= uttakVar;
            }

            document.getElementById('saldoID').innerHTML = nySaldoVar;

        }
    </script>
    



</body>
</html>
