<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 3</h2>

    <input onchange="tempInput = (this.value)">
    <button onclick="visTemperatur()">Sjekk</button>
    <p id="visMelding"></p>


    <script>
        let tempInput;

        function visTemperatur(){
            let melding = sjekkTemp(tempInput)
            document.getElementById('visMelding').innerHTML = melding;

        }

        function sjekkTemp(temp){
            if(temp > 20){
                return "Det er varmt ute!";
            }
            else if(temp >= 5 && temp <= 20){
                return "Det er passe temperatur."
            }
            else if(temp < 5){
                return "Det er kaldt ute!"
            }
        }


    </script>

</body>
</html>
