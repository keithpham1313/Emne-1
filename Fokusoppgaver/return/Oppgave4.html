<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 4</h2>

    <input onchange="alderInput = (this.value)">
    <button onclick="sjekkPris()">Sjekk</button>
    <p id="visPris"></p>


    <script>
        function sjekkPris(){
            let meldingVar = returPris(alderInput);
            document.getElementById('visPris').innerHTML = meldingVar;
        }

        function returPris(alder){
            if(alder < 3){
                return "Pris 0 kr";
            }
            else if(alder >= 3 && alder < 12){
                return "Pris 50 kr";
            }
            else if(alder >= 12){
                return "Pris 100 kr";
            }
        }

    </script>

</body>
</html>
