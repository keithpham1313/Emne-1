<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        .knappGr {
            background-color: green;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
    
    <h2>OPPGAVE 5</h2>

    <input onchange="dagInput = Number(this.value)">
    <button onclick="sjekkDag()">Sjekk</button>
    <p id="visDag"></p>


    <script>
        function sjekkDag(){
            let meldingVar = returDag(dagInput);
            document.getElementById('visDag').innerHTML = meldingVar;
        }

        function returDag(dag){
            if(dag === 6 || dag === 7){
                return "Det er helg!"
            }
            else if(dag >= 1 && dag <= 5){
                return "Det er en ukedag."
            }
            else{
                return "Ugyldig tall. Prøv igjen."
            }
        }


    </script>

</body>
</html>
