<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 2</h2>


    <p><b>Hva fikk du på prøven?</b></p>
    <input onchange="lagreKarakter=this.value" type="number">
    <button onclick="karakterKnapp()">Gi meg karakter</button>

    <p id="visKarakter"></p>

    <script>
        let lagreKarakter;

        function karakterKnapp(){
            if(lagreKarakter >= 90 && lagreKarakter <= 100){
                document.getElementById('visKarakter').innerHTML = "Karakter A";
            }
            else if(lagreKarakter >= 80 && lagreKarakter <= 89){
                document.getElementById('visKarakter').innerHTML = "Karakter B";
            }
            else if(lagreKarakter >= 70 && lagreKarakter <= 79){
                document.getElementById('visKarakter').innerHTML = "Karakter C";
            }
            else if(lagreKarakter >= 60 && lagreKarakter <= 69){
                document.getElementById('visKarakter').innerHTML = "Karakter D";
            }
            else if(lagreKarakter >= 0 && lagreKarakter <= 59){
                document.getElementById('visKarakter').innerHTML = "Karakter F";
            }
        }


    </script>

</body>
</html>
