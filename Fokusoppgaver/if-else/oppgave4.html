<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .darkmode {
            background-color: black;
            color: white;
        }

        .knapp {
            background-color: red;
            color: white;
        }
        
    </style>
</head>
<body id="bakgrunn" class="darkmode">
<body>
    
    <h2>OPPGAVE 4</h2>


    <p><b>Billettpris: Hvor gammel er du?:</b></p>
    <input oninput="alderVar=this.value" type="text">
    <button onclick = "sjekkAlder()">Sjekk</button>
    <p id = visMelding></p>

    <script>
        let alderVar;

        function sjekkAlder(){

        if(alderVar <= 3){
            document.getElementById("visMelding").innerHTML = "Billetten er gratis!";
            }
        else if(alderVar > 3 && alderVar <= 12){
            document.getElementById("visMelding").innerHTML = "Billetten koster 50 kr.";
            }
        else if(alderVar > 12){
            document.getElementById("visMelding").innerHTML = "Billetten koster 100 kr.";
            }

        }
    </script>

    


    </script>

</body>
</html>
