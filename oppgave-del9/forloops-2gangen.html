<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="toGanger()">2 gangern</button>
    <div id="numbers"></div>

    <script>
        function toGanger(){

            let stopValue = 20;

            for(let multiple = 2; multiple <= stopValue; multiple+=2){
                document.getElementById('numbers').innerHTML += '<li>' + multiple + '</li>';
            }
        }
    </script>
</body>
</html>
