<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 20px;

        }

        .sirkel{
            height: 50px;
            width: 50px;
            background-color: grey;
            border-radius: 50%;
            border: 5px solid black;
        }


        /* Hadde denne før .sirkel. Det var derfor den ikke fungerte!!! FML!!! */ 
        .lightOn{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <h1>Please, don't touch my yellow spots!</h1>
    <div id="sirkelBoks" class="container"></div>
    <br> <br> <br> <br> <br>
    <h2>Løpende tid:</h2>
    <h3 id="visTid">0 </h3> <b>I'm going to the F'ing MOON! WEEEEHEEEE!</b>
    <h2>Din reaksjonstid:</h2>
    <div id="visReaksjonsTid"></div>

    <script>
        //Modellen
        let selectedLampIndex = 0;
        let startTime
        let finishTime

        selectRandomLamp();
        
        //Kontrolleren
        function selectRandomLamp(){
            selectedLampIndex = Math.floor(Math.random()*25);
            startTime = new Date().getTime();
            timer = setInterval(tellSekunder, 10);                       //Denne er ikke helt presis. Brukte trial and error.                        
            updateView();
        }
        
        //Viewet
        function updateView(){
            let sirkelTilstand = '';

            for(let i = 0; i < 25; i++){
                if(i === selectedLampIndex){
                    sirkelTilstand += 
                    `<div class ="sirkel lightOn" onclick="reaksjonsTid(); selectRandomLamp()"></div>`;
                }
                else{
                    sirkelTilstand += `<div class ="sirkel"></div>`;
                }
            }

            document.getElementById('sirkelBoks').innerHTML = sirkelTilstand;

        }

        function tellSekunder(){
            naTid = new Date().getTime();
            lopendeTid = naTid - startTime;
            document.getElementById('visTid').innerHTML = lopendeTid;

        }

        function reaksjonsTid(){
            finishTime = new Date().getTime();

            let reaksjonsTime = Math.floor(finishTime - startTime);

            if(reaksjonsTime < 1500){
                document.getElementById('visReaksjonsTid').innerHTML += 
                `<li>${reaksjonsTime} millisekunder</li>`;
            }
            else if(reaksjonsTime > 4000 && reaksjonsTime < 8000){
                document.getElementById('visReaksjonsTid').innerHTML += 
                `<li>${reaksjonsTime} millisekunder (KEEP IT UP, UNC! LMAO)</li>`;
            }
            else if(reaksjonsTime > 8000){
                document.getElementById('visReaksjonsTid').innerHTML += 
                `<li>${reaksjonsTime} millisekunder (DO SOMETHING ELSE! YOU SUCK ASS!)</li>`;
            }            
            else{
                document.getElementById('visReaksjonsTid').innerHTML += 
                `<li>${reaksjonsTime} millisekunder (WOW, SO SLOW!! KEKW)</li>`;
            }            

            clearInterval(timer);

            document.getElementById('visTid').innerHTML = 0;
        }
    </script>
    
</body>
</html>
