<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 20px;

        }

        .sirkel{
            height: 50px;
            width: 50px;
            background-color: grey;
            border-radius: 50%;
            border: 5px solid black;
        }


        /* Hadde denne før .sirkel. Det var derfor den ikke fungerte!!! FML!!! */ 
        .lightOn{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <div id="sirkelBoks" class="container"></div>
    <br> <br> <br> <br> <br>
    <h2>Løpende tid:</h2>
    <h3 id="visTid">0</h3>
    <h2>Din reaksjonstid:</h2>
    <div id="visReaksjonsTid"></div>

    <script>
        //Modellen
        let selectedLampIndex = 0;
            // var startTime = new Date().getTime();
            // var finishTime = new Date().getTime();
            // var spentMilliseconds = Math.floor(finishTime - startTime);
            // var spentSeconds = spentMilliseconds / 1000;
            var timer;
            let spentSeconds = 0;

        selectRandomLamp();
        
        //Kontrolleren
        function selectRandomLamp(){
            selectedLampIndex = Math.floor(Math.random()*25);
            timer = setInterval(tellSekunder, 1000);
            updateView();
        }
        
        //Viewet
        function updateView(){
            let sirkelTilstand = '';

            for(let i = 0; i < 25; i++){
                if(i === selectedLampIndex){
                    sirkelTilstand += `<div class ="sirkel lightOn" onclick="selectRandomLamp(); reaksjonsTid()"></div>`;
                }
                else{
                    sirkelTilstand += `<div class ="sirkel"></div>`;
                }
            }

            document.getElementById('sirkelBoks').innerHTML = sirkelTilstand;

        }

        function tellSekunder(){
            document.getElementById('visTid').innerHTML = spentSeconds;
            spentSeconds++;

        }

        function reaksjonsTid(){
            document.getElementById('visReaksjonsTid').innerHTML += 
            `<li>${spentSeconds-1} sekunder</li>`;
            clearInterval(timer);
            spentSeconds = 0;
        }
    </script>
    
</body>
</html>
