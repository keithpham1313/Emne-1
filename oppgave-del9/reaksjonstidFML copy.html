<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 20px;

        }

        .sirkel{
            height: 50px;
            width: 50px;
            background-color: grey;
            border-radius: 50%;
            border: 5px solid black;
        }


        /* Hadde denne før .sirkel. Det var derfor den ikke fungerte!!! FML!!! */ 
        .lightOn{
            background-color: yellow;
        }

        .tidenDetTar{
            font-size: 25px;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>En liten sammenligning på setInterval() og getTime()</h1>
    <div id="sirkelBoks" class="container"></div>
    <br> <br> <br> <br> <br>

    <!-- setInterval() -->
        <br>
        <h2>"Tid" i setInterval():</h2>
        <div id="viseTidStopp">0</div>

        <h2>Registrert "tid" i setInterval():</h2>
        <div id="forrigeRunde" class="tidenDetTar"></div>



    <h2>Løpende tid (Det samme som setInterval()):</h2>
    <div id="visTid">0 </div>
    <h2>Registrert tid ved bruk av getTime()):</h2>
    <div id="visReaksjonsTid" class="tidenDetTar"></div>

    <script>
        //Modellen
        let selectedLampIndex = 0;
        let startTime;
        let finishTime;
        let timerTid;

        const viseTid = document.getElementById('viseTidStopp');         //Finner HTML-elementet med id="viseTid" og lagrer det i variabelen viseTid. Da kan vi senere skrive til dette elementet: viseTid.innerHTML = seconds;
        const rundeTid = document.getElementById('forrigeRunde');   //Finner HTML-elementet med id="forrigeRunde" og lagrer det i rundeTid. Vi trenger det for å kunne skrive rundetidene inn på nettsiden.
        let sekunder = 0;
        let timer;

        selectRandomLamp();
        
        //Kontrolleren
        function selectRandomLamp(){
            selectedLampIndex = Math.floor(Math.random()*25);
            startTime = new Date().getTime();

            timerTid = setInterval(tellSekunder, 10);                       //Denne er ikke helt presis. Brukte trial and error.                        
            timer = setInterval(tellSekunder1, 10);                        //setInterval betyr kjør denne funksjonen gjentatte ganger med et bestemt tidsintervall. 1000 millisekunder = 1 sekund. Så tellSekunder() kjøres én gang hvert sekund.

            updateView();
        }
        
        //Viewet
        function updateView(){
            let sirkelTilstand = '';

            for(let i = 0; i < 25; i++){
                if(i === selectedLampIndex){
                    sirkelTilstand += 
                    `<div class ="sirkel lightOn" onclick="reaksjonsTid(); registrereTid(); selectRandomLamp()"></div>`;
                }
                else{
                    sirkelTilstand += `<div class ="sirkel"></div>`;
                }
            }

            document.getElementById('sirkelBoks').innerHTML = sirkelTilstand;

        }

        function tellSekunder(){
            naTid = new Date().getTime();
            lopendeTid = naTid - startTime;
            document.getElementById('visTid').innerHTML = lopendeTid;

        }

        function reaksjonsTid(){
            finishTime = new Date().getTime();

            let reaksjonsTime = Math.floor(finishTime - startTime);

                document.getElementById('visReaksjonsTid').innerHTML += 
                `<li>${reaksjonsTime} millisekunder</li>`;

            clearInterval(timerTid);

            document.getElementById('visTid').innerHTML = 0;
        }

        /* setInterval()*/

        function tellSekunder1(){          
            viseTid.innerHTML = sekunder;  
            sekunder += 10;                                
        }

        function registrereTid(){
            rundeTid.innerHTML += `<li>${sekunder} millisekunder</li>`;
            clearInterval(timer);                                  
            sekunder = 0;
        }

    </script>
    
</body>
</html>
